name: template-check

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # Isolate large qualification workloads without extending any watchdog.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        phase: [application, race, qualification]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/spikes/river/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install declared pnpm version
        run: npm install --global pnpm@10.33.0
      - name: Verify selected phase
        env:
          VERIFY_PHASE: ${{ matrix.phase }}
        run: |
          bash scripts/ci-postgres.sh "$VERIFY_PHASE"
          git diff --exit-code

  verify:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require all verification phases
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: test "$CHECKS_RESULT" = success
