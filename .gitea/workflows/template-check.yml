name: template-check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Standard tests and uncached races each have a bounded 15m package budget.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install declared pnpm version
        run: npm install --global pnpm@10.33.0
      - name: Verify application
        run: |
          bash scripts/ci-postgres.sh
          git diff --exit-code
