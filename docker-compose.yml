services:
  postgres:
    image: docker.io/library/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      OVERLAID_DATABASE_PASSWORD: ${OVERLAID_DATABASE_PASSWORD:-change-me-runtime}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/00-migrations.sh:ro
      - ./scripts/postgres-runtime.sh:/docker-entrypoint-initdb.d/zz-runtime.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    restart: unless-stopped
    environment:
      API_ADDR: ${API_ADDR:-:8080}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-*}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-selfhost}
      PRODUCT_NAME: ${PRODUCT_NAME:-overlaid}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      VAULT_ACTIVE_KEY: ${VAULT_ACTIVE_KEY:-}
      VAULT_KEYS: ${VAULT_KEYS:-}
      EXPOSURE_MODE: ${EXPOSURE_MODE:-local}
      OPERATOR_SECRET: ${OPERATOR_SECRET:-}
      OVERLAY_TOKEN: ${OVERLAY_TOKEN:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      NEWSROOM_DISCORD_WEBHOOK: ${NEWSROOM_DISCORD_WEBHOOK:-}
      NEWSROOM_AI_MODEL: ${NEWSROOM_AI_MODEL:-claude-haiku-4-5-20251001}
      BOT_COMMANDS_FILE: ${BOT_COMMANDS_FILE:-/data/bot-commands.json}
      NEWSROOM_FILE: ${NEWSROOM_FILE:-/data/newsroom.json}
      OVERLAY_STATE_FILE: ${OVERLAY_STATE_FILE:-/data/overlay-state.json}
      EVENT_HISTORY_FILE: ${EVENT_HISTORY_FILE:-/data/event-history.jsonl}
      EVENT_HISTORY_LIMIT: ${EVENT_HISTORY_LIMIT:-250}
      DATABASE_URL: ${DATABASE_URL:-postgres://overlaid_app:${OVERLAID_DATABASE_PASSWORD:-change-me-runtime}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable}
      OBS_WEBSOCKET_URL: ${OBS_WEBSOCKET_URL:-ws://host.docker.internal:4455}
      OBS_WEBSOCKET_PASSWORD: ${OBS_WEBSOCKET_PASSWORD:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
      TWITCH_CHANNEL: ${TWITCH_CHANNEL:-patrick__eff}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
      TWITCH_REDIRECT_URL: ${TWITCH_REDIRECT_URL:-}
      TWITCH_TOKEN_FILE: ${TWITCH_TOKEN_FILE:-/data/twitch-token.json}
      TWITCH_INTERACTIONS_FILE: ${TWITCH_INTERACTIONS_FILE:-/data/twitch-interactions.json}
      TWITCH_EVENTSUB_ENABLED: ${TWITCH_EVENTSUB_ENABLED:-true}
      TWITCH_STREAM_DISPATCH_MODE: ${TWITCH_STREAM_DISPATCH_MODE:-legacy}
      PLATFORM_STREAM_WORKER_DATABASE_URL: ${PLATFORM_STREAM_WORKER_DATABASE_URL:-}
      TWITCH_CHAT_DISPATCH_MODE: ${TWITCH_CHAT_DISPATCH_MODE:-legacy}
      PLATFORM_WORKER_DATABASE_URL: ${PLATFORM_WORKER_DATABASE_URL:-}
      TWITCH_CHAT_SEND_MODE: ${TWITCH_CHAT_SEND_MODE:-legacy}
      TWITCH_MODERATION_MODE: ${TWITCH_MODERATION_MODE:-legacy}
      PLATFORM_MODERATION_WORKER_DATABASE_URL: ${PLATFORM_MODERATION_WORKER_DATABASE_URL:-}
      OVERLAID_MODERATION_PACING_DATABASE_URL: ${OVERLAID_MODERATION_PACING_DATABASE_URL:-}
      TENANT_RUNTIME_LIMIT: ${TENANT_RUNTIME_LIMIT:-100}
      PLATFORM_OUTBOUND_WORKER_DATABASE_URL: ${PLATFORM_OUTBOUND_WORKER_DATABASE_URL:-}
      OVERLAID_PACING_DATABASE_URL: ${OVERLAID_PACING_DATABASE_URL:-}
      OVERLAID_BOT_EXECUTION_DATABASE_URL: ${OVERLAID_BOT_EXECUTION_DATABASE_URL:-}
      TWITCH_SCOPES: ${TWITCH_SCOPES:-user:read:chat user:write:chat channel:read:redemptions channel:manage:redemptions channel:read:subscriptions bits:read moderator:read:followers moderator:manage:chat_messages moderator:manage:banned_users}
      MPRIS_ENABLED: ${MPRIS_ENABLED:-false}
      MPRIS_PLAYER: ${MPRIS_PLAYER:-}
      MPRIS_PLAYER_PRIORITY: ${MPRIS_PLAYER_PRIORITY:-Feishin,mpv,cliamp,ferrosonic,playerctld,vivaldi}
      MPRIS_POLL_INTERVAL: ${MPRIS_POLL_INTERVAL:-2s}
      DBUS_SESSION_BUS_ADDRESS: ${DBUS_SESSION_BUS_ADDRESS:-}
    volumes:
      - api-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q '<div id=\"root\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  api-data:
  postgres-data:
