# Optional local overrides for advanced host integrations.
# Copy selected sections into docker-compose.override.yml and adjust UID/GID/paths.

services:
  api:
    # For local OBS on Linux, host networking is the simplest way for the API
    # container to reach OBS WebSocket on localhost:4455.
    # Copy this file to docker-compose.override.yml, uncomment these lines, and
    # set OBS_WEBSOCKET_URL=ws://localhost:4455 in .env or below. When host
    # networking is enabled, also point DATABASE_URL at the host-published
    # Postgres port because the Compose DNS name `postgres` is unavailable.
    # network_mode: host
    # ports: []
    # environment:
    #   OBS_WEBSOCKET_URL: ws://localhost:4455
    #   DATABASE_URL: postgres://overlaid_app:${OVERLAID_DATABASE_PASSWORD:-change-me-runtime}@localhost:${POSTGRES_PORT:-55432}/${POSTGRES_DB:-app}?sslmode=disable

    # MPRIS runs on the host user session bus. Enable this only when the API
    # container should read now-playing data from the same Linux desktop user.
    # Because this switches away from the image's built-in non-root user,
    # bind-mount a host-owned data directory so token/state files remain writable:
    #   mkdir -p ./.local-data/api && chown 1000:1000 ./.local-data/api
    user: "1000:1000"
    environment:
      MPRIS_ENABLED: "true"
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1000/bus
    volumes:
      - ./.local-data/api:/data
      - /run/user/1000/bus:/run/user/1000/bus

  postgres:
    # Uncomment for local database debugging from the host.
    # ports:
    #   - "${POSTGRES_PORT:-55432}:5432"
    ports: []
