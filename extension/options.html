<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Over-Laid Newsroom extension</title><style>body{max-width:680px;margin:40px auto;font:16px system-ui;padding:16px;background:#131518;color:#e9e7e3}label{display:grid;gap:8px;margin:20px 0}input,select,button{padding:10px;font:inherit}p{line-height:1.5}</style></head><body><h1>Over-Laid Newsroom</h1><p>Generate an add token in Newsroom settings. Use your API origin, including its port when applicable.</p><form id="settings"><label>API origin<input id="api" type="url" required placeholder="https://api.example.org"></label><label>Add token<input id="token" type="password" required autocomplete="new-password"></label><button type="submit">Save connection</button></form><p id="status" role="status"></p><label>Default shelf<select id="shelf"><option value="">Live deck</option></select></label><label>Default show segment<select id="segment"><option value="">Ungrouped</option></select></label><button id="targets">Refresh destinations</button><script src="options.js"></script></body></html>
